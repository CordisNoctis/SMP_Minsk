<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Документ — СМП Минск</title>
  <meta name="theme-color" content="#7A1F2B">

  <script src="../js/core/theme-init.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/cheatsheet.css">

  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    /* Длинные названия документов: переносим на несколько строк */
    .docmd-title {
      white-space: normal;
      line-height: 1.25;
      font-size: 0.95rem;
    }
    @media (max-width: 480px) {
      .docmd-title { font-size: 0.85rem; }
    }
    .docmd-error {
      padding: 20px 16px;
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Картинки в документе: клик открывает полноэкранный просмотр */
    #docMdContent img.drug-img { cursor: zoom-in; }

    /* SVG с чёрным текстом: в тёмной теме чёрное становится белым,
       в светлой теме остаётся как есть */
    [data-theme="dark"] img.docmd-svg-invert {
      filter: invert(1) hue-rotate(180deg);
    }

    /* ===== Полноэкранный просмотр картинки ===== */
    .docmd-lightbox {
      position: fixed;
      inset: 0;
      z-index: 400;
      display: flex;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.92);
    }
    .docmd-lightbox[hidden] { display: none; }

    .docmd-lightbox-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      padding-top: calc(10px + env(safe-area-inset-top));
      color: #fff;
    }
    .docmd-lightbox-bar span {
      min-width: 52px;
      text-align: center;
      font-size: 0.85rem;
    }
    .docmd-lightbox-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 1.15rem;
      cursor: pointer;
    }
    .docmd-lightbox-btn:active { background: rgba(255, 255, 255, 0.28); }
    .docmd-lightbox-close { margin-left: auto; }

    .docmd-lightbox-stage {
      flex: 1;
      overflow: hidden;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .docmd-lightbox-stage img {
      max-width: 100%;
      max-height: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }
    .docmd-lightbox-stage img.is-pannable { cursor: grab; }
  </style>
</head>

<body>
  <header class="page-header">
    <button type="button" class="back-button" data-back data-back-fallback="normative-base.html" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="page-title-centered docmd-title" id="docMdTitle">Документ</h1>
    <span class="header-spacer" aria-hidden="true"></span>
  </header>

  <main class="page">
    <div class="drug-content" id="docMdContent">
      <p class="docmd-error">Загрузка документа…</p>
    </div>
  </main>

  <!-- Полноэкранный просмотр картинки -->
  <div class="docmd-lightbox" id="docmdLightbox" hidden>
    <div class="docmd-lightbox-bar">
      <button type="button" class="docmd-lightbox-btn" id="docmdZoomOut" aria-label="Уменьшить">−</button>
      <span id="docmdZoomLabel">100%</span>
      <button type="button" class="docmd-lightbox-btn" id="docmdZoomIn" aria-label="Увеличить">+</button>
      <button type="button" class="docmd-lightbox-btn docmd-lightbox-close" id="docmdLightboxClose" aria-label="Закрыть">✕</button>
    </div>
    <div class="docmd-lightbox-stage" id="docmdLightboxStage">
      <img id="docmdLightboxImg" alt="">
    </div>
  </div>

  <script src="../js/core/theme.js"></script>
  <script src="../js/core/back.js"></script>
  <script src="../js/cheats/markdown.js"></script>
  <script src="../js/core/sw-register.js"></script>
  <script>
    (function () {
      "use strict";

      var titleEl = document.getElementById("docMdTitle");
      var contentEl = document.getElementById("docMdContent");

      function showError(msg) {
        contentEl.innerHTML = '<p class="docmd-error">' + msg + "</p>";
      }

      var params = new URLSearchParams(window.location.search);
      var file = params.get("file") || "";

      // Безопасность: только имя файла — латиница, цифры, дефис, .md
      if (!/^[a-z0-9-]+\.md$/i.test(file)) {
        showError("Документ не указан.");
        return;
      }

      fetch("../docs/" + file)
        .then(function (resp) {
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          return resp.text();
        })
        .then(function (md) {
          // Заголовок документа: параметр ?title= или первая строка «## …»
          var lines = md.split(/\r?\n/);
          var title = params.get("title");
          if (!title) {
            for (var k = 0; k < lines.length; k++) {
              var m = lines[k].trim().match(/^##\s+(.*)$/);
              if (m) { title = m[1]; lines.splice(k, 1); break; }
            }
          }
          if (title) {
            titleEl.textContent = title;
            document.title = title + " — СМП Минск";
          }

          contentEl.innerHTML = window.SMP.markdown.parse(lines.join("\n"));

          // Картинки, указанные в markdown просто именем файла
          // (![схема](risunok.png)), ищем в папке docs/img/
          contentEl.querySelectorAll("img.drug-img").forEach(function (img) {
            var src = img.getAttribute("src") || "";
            if (!/^(https?:|\/|data:|\.\.\/)/i.test(src)) {
              img.src = "../docs/img/" + src;
            }
            // SVG инвертируется в тёмной теме (чёрный текст → белый)
            if (/\.svg(\?|$)/i.test(img.src)) {
              img.classList.add("docmd-svg-invert");
            }
          });
        })
        .catch(function () {
          showError("Не удалось загрузить документ. Проверьте подключение к интернету и обновите приложение — новые документы появляются после обновления.");
        });
    })();
  </script>

  <script>
    // ===== Полноэкранный просмотр картинок документа =====
    (function () {
      "use strict";

      var contentEl = document.getElementById("docMdContent");
      var lb = document.getElementById("docmdLightbox");
      var lbImg = document.getElementById("docmdLightboxImg");
      var stage = document.getElementById("docmdLightboxStage");
      var zoomLabel = document.getElementById("docmdZoomLabel");
      if (!contentEl || !lb || !lbImg || !stage) return;

      var scale = 1, tx = 0, ty = 0;
      var pointers = new Map();
      var lastDist = 0, lastMid = null;

      function apply() {
        if (scale <= 1.01) { scale = Math.max(scale, 0.2); if (scale <= 1.01) { scale = 1; tx = 0; ty = 0; } }
        lbImg.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
        lbImg.classList.toggle("is-pannable", scale > 1);
        if (zoomLabel) zoomLabel.textContent = Math.round(scale * 100) + "%";
      }

      function setScale(s) {
        scale = Math.min(8, Math.max(0.2, s));
        if (scale <= 1) { tx = 0; ty = 0; }
        apply();
      }

      function open(img) {
        lbImg.src = img.currentSrc || img.src;
        lbImg.alt = img.alt || "";
        lbImg.classList.toggle("docmd-svg-invert", img.classList.contains("docmd-svg-invert"));
        scale = 1; tx = 0; ty = 0;
        apply();
        lb.hidden = false;
        document.body.classList.add("modal-open");
      }

      function close() {
        lb.hidden = true;
        document.body.classList.remove("modal-open");
        pointers.clear();
      }

      // Открытие по клику на картинку в документе
      contentEl.addEventListener("click", function (e) {
        var img = e.target.closest("img.drug-img");
        if (img) { e.preventDefault(); open(img); }
      });

      document.getElementById("docmdLightboxClose").addEventListener("click", close);
      document.getElementById("docmdZoomIn").addEventListener("click", function () { setScale(scale * 1.25); });
      document.getElementById("docmdZoomOut").addEventListener("click", function () { setScale(scale / 1.25); });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !lb.hidden) close();
      });

      // Закрытие по клику на фон (не по картинке)
      stage.addEventListener("click", function (e) {
        if (e.target === stage) close();
      });

      // Двойной клик/тап: переключение 100% ↔ 250%
      stage.addEventListener("dblclick", function (e) {
        e.preventDefault();
        if (scale > 1.01) { setScale(1); } else { setScale(2.5); }
      });

      // Колесо мыши: масштаб
      stage.addEventListener("wheel", function (e) {
        e.preventDefault();
        setScale(scale * (e.deltaY < 0 ? 1.2 : 1 / 1.2));
      }, { passive: false });

      function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
      function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

      // Перетаскивание (один палец/мышь) и щипок (два пальца)
      stage.addEventListener("pointerdown", function (e) {
        stage.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 2) {
          var p = Array.from(pointers.values());
          lastDist = dist(p[0], p[1]);
          lastMid = mid(p[0], p[1]);
        }
      });

      stage.addEventListener("pointermove", function (e) {
        if (!pointers.has(e.pointerId)) return;
        var prev = pointers.get(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 1 && scale > 1) {
          tx += e.clientX - prev.x;
          ty += e.clientY - prev.y;
          apply();
        } else if (pointers.size === 2) {
          var p = Array.from(pointers.values());
          var d = dist(p[0], p[1]);
          var m = mid(p[0], p[1]);
          if (lastDist > 0) setScale(scale * d / lastDist);
          tx += m.x - lastMid.x;
          ty += m.y - lastMid.y;
          lastDist = d;
          lastMid = m;
          apply();
        }
      });

      function endPointer(e) {
        pointers.delete(e.pointerId);
        lastDist = 0;
      }
      stage.addEventListener("pointerup", endPointer);
      stage.addEventListener("pointercancel", endPointer);
    })();
  </script>
</body>
</html>
