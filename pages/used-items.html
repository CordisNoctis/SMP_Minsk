<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">  <title>Использованные средства — СМП-103</title>
  <meta name="theme-color" content="#7A1F2B">

  <script src="../js/core/theme-init.js"></script>
  <link rel="stylesheet" href="../css/styles.css">

  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="СМП-103">
</head>

<body>
  <header class="page-header">
    <button type="button" class="back-button" data-back data-back-fallback="shift-checklist.html" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="page-title-centered">Использованные средства</h1>
    <span class="header-spacer" aria-hidden="true"></span>
  </header>

  <main id="main" class="page used-items-page">
    <section class="card">
      <div id="usedRecordsList" class="used-items-list"></div>
      <p id="usedRecordsEmpty" class="muted" hidden style="text-align:center; padding: 4px 0; margin: 0;">        Записей пока нет. Добавьте первый вызов.
      </p>

      <button type="button" class="backup-btn backup-btn-export" id="addRecordBtn" style="margin-top: 12px;">
        <span aria-hidden="true">➕</span> Добавить вызов
      </button>
    </section>
  </main>

  <!-- Нижние кнопки -->
  <div class="used-bottom-bar">
    <button type="button" class="used-bottom-btn" id="createReportBtn">📄 Создать отчет</button>
    <button type="button" class="used-bottom-btn used-bottom-danger" id="clearShiftBtn">🗑️ Очистить смену</button>
  </div>

  <!-- Модалка формы записи -->
  <div class="modal" id="record-form-modal" hidden aria-hidden="true">
    <div class="modal-backdrop" data-modal-close></div>
    <section class="modal-panel" role="dialog" aria-modal="true">
      <header class="modal-header">
        <h2 id="recordFormTitle">Новая запись</h2>
        <button type="button" class="modal-close" data-modal-close aria-label="Закрыть">×</button>
      </header>

      <div class="modal-body">
        <div class="settings-form">
          <label class="used-form-field">
            <span>Примечание</span>
            <input type="text" id="recNote" maxlength="200" placeholder="Любая информация">
          </label>

          <div class="used-items-block">
            <span class="used-items-block-label">Использованные средства и ЛС</span>
            <div id="recItemsRows"></div>
            <button type="button" class="btn-secondary used-add-row-btn" id="addRecItemRowBtn">➕ Добавить средство</button>
          </div>
        </div>
      </div>

      <footer class="modal-footer">
        <button type="button" class="btn-secondary" data-modal-close>Отмена</button>
        <button type="button" class="btn-primary" id="saveRecordBtn">Сохранить</button>
      </footer>
    </section>
  </div>

  <!-- Модалка отчёта с таблицей -->
  <div class="modal" id="report-modal" hidden aria-hidden="true">
    <div class="modal-backdrop" data-modal-close></div>
    <section class="modal-panel" role="dialog" aria-modal="true">
      <header class="modal-header">
        <h2>Отчет по смене</h2>
        <button type="button" class="modal-close" data-modal-close aria-label="Закрыть">×</button>
      </header>
      <div class="modal-body">
        <div class="report-table-wrap" id="reportTableWrap"></div>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn-primary" id="reportExportPngBtn">📤 Поделиться / Сохранить</button>
      </footer>
    </section>
  </div>

  <script src="../vendor/html2canvas.min.js"></script>
  <script src="../js/core/theme.js"></script>
  <script src="../js/core/modal.js"></script>
  <script src="../js/core/confirm.js"></script>
  <script src="../js/core/back.js"></script>
  <script src="../js/core/exporter.js"></script> 
  <script src="../js/checklist/medical-items.js"></script>
  <script src="../js/checklist/medical-tables.js"></script>
  <script src="../js/checklist/equipment-data.js"></script>
  <script src="../js/checklist/used-items.js"></script>
  <script src="../js/core/sw-register.js"></script>
  <link rel="stylesheet" href="../css/medical-picker.css">
  <script src="../js/checklist/medical-picker.js"></script>
</body>
</html>
