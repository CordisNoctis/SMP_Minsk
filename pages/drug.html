<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Препарат — СМП Минск</title>
  <meta name="theme-color" content="#7A1F2B">

  <script src="../js/core/theme-init.js"></script>
  <script src="../js/core/version.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/cheatsheet.css">

  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>

<body>
  <header class="page-header">
    <button type="button" class="back-button" data-back data-back-fallback="drugs.html" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="page-title-centered" id="drugTitle">Препарат</h1>
    <span class="header-spacer" aria-hidden="true"></span>
  </header>

  <main class="page">
    <!-- Заглушка для отсутствующего препарата -->
    <section class="card coming-soon-card drug-not-found" id="drugNotFound" hidden>
      <div class="coming-soon-icon" aria-hidden="true">⏰</div>
      <h2 class="coming-soon-title">Инструкция в разработке</h2>
      <p class="coming-soon-description">
        Инструкция к этому препарату ещё не загружена в базу. Совсем скоро здесь появится подробная информация для специалиста и пациента.
      </p>
      <a href="drugs.html" class="btn-primary coming-soon-btn">← К списку препаратов</a>
    </section>

    <!-- Переключатель инструкций -->
    <div class="drug-tabs" id="drugTabs" hidden>
      <button type="button" class="drug-tab active" id="tabSpec">Специалисту</button>
      <button type="button" class="drug-tab" id="tabPat">Пациенту</button>
    </div>

    <!-- Блок для специалиста -->
    <div class="drug-content" id="specContent"></div>

    <!-- Блок для пациента -->
    <div class="drug-content" id="patContent" hidden></div>
  </main>

  <script src="../js/core/theme.js"></script>
  <script src="../js/core/back.js"></script>
  <script src="../js/cheats/markdown.js"></script>
  <script src="../js/cheats/drugs-data.js"></script>
    <script>
    (function () {
      "use strict";

      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      var drug = (window.SMP && window.SMP.drugs && window.SMP.drugs.get)
        ? window.SMP.drugs.get(id)
        : null;

      // Если препарат не найден — показываем заглушку и скрываем остальные блоки
      if (!drug) {
        var notFoundEl = document.getElementById("drugNotFound");
        var tabsEl = document.getElementById("drugTabs");
        var specEl = document.getElementById("specContent");
        var patEl = document.getElementById("patContent");

        if (notFoundEl) notFoundEl.hidden = false;
        if (tabsEl) tabsEl.hidden = true;
        if (specEl) specEl.hidden = true;
        if (patEl) patEl.hidden = true;

        // Отключаем дальнейшую обработку cheatsheet.js
        window.__SMP_DRUG_NOT_FOUND__ = true;
      }
    })();
  </script>
  <script src="../js/cheats/cheatsheet.js"></script>
  <script src="../js/core/sw-register.js"></script>
</body>
</html>
