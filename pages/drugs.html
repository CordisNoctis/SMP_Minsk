<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Инструкции лекарственных средств — СМП Минск</title>
  <meta name="theme-color" content="#7A1F2B">

  <script src="../js/core/theme-init.js"></script>
  <script src="../js/core/version.js"></script>
  <link rel="stylesheet" href="../css/styles.css">

  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>

<body>
  <header class="page-header">
    <button type="button" class="back-button" data-back data-back-fallback="cheatsheets.html" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="page-title-centered drugs-page-title">Инструкции лекарственных средств</h1>
    <span class="header-spacer" aria-hidden="true"></span>
  </header>

  <main class="page">
    <!-- Поиск -->
    <div class="drugs-search-wrap" id="drugsSearchWrap">
      <input
        type="search"
        id="drugsSearch"
        class="drugs-search"
        placeholder="Поиск препарата..."
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >
    </div>

    <!-- Заглушка для пустой базы -->
    <section class="card coming-soon-card drugs-empty-state" id="drugsEmptyState" hidden>
      <div class="coming-soon-icon" aria-hidden="true">⏰</div>
      <h2 class="coming-soon-title">Инструкции готовятся к загрузке</h2>
      <p class="coming-soon-description">
        Работаю над базой официальных инструкций к препаратам из табеля оснащения. Совсем скоро здесь появится подробная информация по каждому средству.
      </p>
    </section>

    <nav id="drugsList" class="list-grid" aria-label="Список препаратов"></nav>
    <p id="drugsEmpty" class="muted" style="text-align:center; padding:20px 0;" hidden>
      По запросу ничего не найдено
    </p>
  </main>

  <script src="../js/core/theme.js"></script>
  <script src="../js/core/back.js"></script>
  <script src="../js/cheats/drugs-db.js"></script>
  <script>
    (function () {
      "use strict";

      var listEl = document.getElementById("drugsList");
      var emptyEl = document.getElementById("drugsEmpty");
      var searchEl = document.getElementById("drugsSearch");
      var emptyStateEl = document.getElementById("drugsEmptyState");
      var searchWrapEl = document.getElementById("drugsSearchWrap");

      if (!listEl) return;

      // Проверяем доступность drugsDB
      if (!window.SMP || !window.SMP.drugsDB) {
        console.error("drugsDB не загружен");
        if (emptyStateEl) emptyStateEl.hidden = false;
        if (searchWrapEl) searchWrapEl.hidden = true;
        if (listEl) listEl.hidden = true;
        return;
      }

      // Загружаем список препаратов асинхронно
      window.SMP.drugsDB.list().then(function (drugs) {
        if (!drugs || drugs.length === 0) {
          // База пустая — показываем заглушку
          if (emptyStateEl) emptyStateEl.hidden = false;
          if (searchWrapEl) searchWrapEl.hidden = true;
          if (listEl) listEl.hidden = true;
          return;
        }

        // Сортируем по алфавиту
        drugs.sort(function (a, b) {
          return (a.title || "").localeCompare(b.title || "", "ru", { sensitivity: "base" });
        });

        // Рендерим список
        var items = [];
        drugs.forEach(function (drug) {
          var a = document.createElement("a");
          a.className = "submenu-link large";
          a.href = "drug.html?id=" + encodeURIComponent(drug.id);
          a.textContent = drug.title || drug.id;
          a.dataset.searchText = (drug.title || "").toLowerCase();
          
          // Добавляем информацию о группе (если есть)
          if (drug.group) {
            a.dataset.group = drug.group;
          }
          
          listEl.appendChild(a);
          items.push(a);
        });

        // Функция фильтрации (локальный поиск по уже отрендеренным элементам)
        function applyFilter(q) {
          q = (q || "").trim().toLowerCase();
          var visibleCount = 0;
          items.forEach(function (a) {
            var match = !q || a.dataset.searchText.indexOf(q) !== -1;
            a.style.display = match ? "" : "none";
            if (match) visibleCount++;
          });
          if (emptyEl) emptyEl.hidden = visibleCount > 0;
        }

        // Привязываем поиск
        if (searchEl) {
          searchEl.addEventListener("input", function () { applyFilter(this.value); });
          searchEl.addEventListener("search", function () { applyFilter(this.value); });
        }

        // Первоначальное состояние
        applyFilter(searchEl ? searchEl.value : "");
      }).catch(function (err) {
        console.error("Ошибка загрузки списка препаратов:", err);
        if (emptyStateEl) emptyStateEl.hidden = false;
        if (searchWrapEl) searchWrapEl.hidden = true;
        if (listEl) listEl.hidden = true;
      });
    })();
  </script>
  <script src="../js/core/sw-register.js"></script>
</body>
</html>
