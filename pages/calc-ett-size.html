<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Размер ЭТТ (дети) — СМП Минск</title>
  <meta name="theme-color" content="#7A1F2B">
  <script src="../js/theme-init.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/calculators.css">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
</head>
<body>
  <header class="page-header">
    <button type="button" class="back-button" data-back data-back-fallback="calculators.html" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="page-title-centered">Размер ЭТТ для детей</h1>
    <button type="button" class="header-alert-btn" id="calcInfoBtn" aria-label="О калькуляторе">i</button>
  </header>
  <main class="page">
    <section class="card calc-description">
      <p style="margin:0;">Расчёт внутреннего диаметра эндотрахеальной трубки по формуле Коула для детей 0–16 лет.</p>
    </section>
    <div class="card ett-input-section">
      <label class="ett-input-label">📅 Возраст ребёнка</label>
      <div class="ett-input-row">
        <input type="text" id="ageInput" class="ett-age-input" inputmode="decimal" placeholder="—" maxlength="4">
        <span class="ett-age-unit">лет</span>
      </div>
      <div class="ett-formulas-hint">
        Без манжеты: 4 + возраст/4<br>
        С манжетой: 3.5 + возраст/4
      </div>
    </div>
    <div id="resultPanel" class="result-panel"></div>
  </main>
  <script src="../js/theme.js"></script>
  <script src="../js/back.js"></script>
  <script src="../js/calculators/calculator-utils.js"></script>
  <script src="../js/calculators/calc-ett-size.js"></script>
  <script src="../js/sw-register.js"></script>
</body>
</html>
