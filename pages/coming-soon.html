<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>В разработке — СМП Минск</title>
  <meta name="theme-color" content="#7A1F2B">

  <script src="../js/core/theme-init.js"></script>
  <link rel="stylesheet" href="../css/styles.css">

  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body>
  <header class="page-header">
    <button type="button" class="back-button" data-back aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="page-title-centered" id="pageTitle">В разработке</h1>
    <span class="header-spacer" aria-hidden="true"></span>
  </header>

  <main id="main" class="page">
    <section class="card coming-soon-card">
      <div class="coming-soon-icon" id="pageIcon" aria-hidden="true">🚧</div>
      <h2 class="coming-soon-title" id="comingSoonTitle">Раздел в разработке</h2>
      <p class="coming-soon-description" id="comingSoonDescription">
        Работаю над этим разделом, чтобы сделать его максимально полезным для вашей работы. Совсем скоро здесь появится что-то действительно крутое!
      </p>
      <a id="backLink" href="../index.html" class="btn-primary coming-soon-btn">← Назад</a>
    </section>
  </main>

  <script src="../js/core/theme.js"></script>
  <script src="../js/core/back.js"></script>
  <script>
    (function () {
      "use strict";
      var params = new URLSearchParams(window.location.search);
      var title = params.get("title");
      var subtitle = params.get("subtitle");
      var icon = params.get("icon");
      var back = params.get("back");

      if (title) {
        document.title = title + " — в разработке";
        document.getElementById("comingSoonTitle").textContent = title;
      }
      if (subtitle) {
        document.getElementById("comingSoonDescription").textContent = subtitle;
      }
      if (icon) {
        document.getElementById("pageIcon").textContent = icon;
      }
      var link = document.getElementById("backLink");
      if (back) link.href = back;
      else if (document.referrer) link.href = document.referrer;
    })();
  </script>
  <script src="../js/core/sw-register.js"></script>
</body>
</html>
