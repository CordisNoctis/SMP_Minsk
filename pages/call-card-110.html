{"n":"16","t":"В графе «Жалобы» перечислить основные и второстепенные жалобы, а также наличие сочетания жалоб, характерных для основного заболевания (патологического состояния). Вначале указать основные жалобы, послужившие поводом для вызова бригады СМП. Дать развернутую характеристику жалобам по следующим характеристикам: 1) сила; 2) характер; 3) локализация; 4) распространенность; 5) иррадиация; 6) продолжительность; 7) наличие провоцирующих факторов; 8) наличие факторов, облегчающих боль, 9) время появления;"},

"21.5. В пункте «сознание»: □ ясное, □ приглушенное, □ сопор, □ кома, □ отсутствует - отметить нужное знаком ✓.",
"Критериями оценки состояния сознания являются способность больного правильно ориентироваться в собственной личности, времени и окружающей обстановке, а также скорость мыслительных процессов.",
"Заключение о состоянии сознания делается в процессе расспроса больного: при сборе паспортных данных выявляют ориентировку в собственной личности, при сборе анамнеза заболевания – ориентировку во времени и окружающей обстановке:",
"• ясное сознание – больной активно беседует, адекватно, без затруднений отвечает на вопросы; ориентируется в пространстве и во времени;",
"• приглушенное сознание – больной заторможен, речь замедлена, на большинство вопросов отвечает правильно, но с запаздыванием, иногда невпопад;",
"• сопор – более глубокое нарушение сознания, когда больной как бы впадает в сон, из которого его можно на короткое время вывести окриком или тормошением, медленно отвечает только на самые элементарные вопросы, не отвечает – на более сложные, плохо ориентируется в окружающей обстановке, элементы ориентировки в собственной личности выявляются;",
"• кома – больного не удается вывести из состояния сна, все виды ориентировки отсутствуют, на вопросы не отвечает, реагирует рефлекторно на болевые раздражители (отдергивание руки в ответ на легкий укол иголкой);",
"• отсутствует – полное угнетение сознания, больной не реагирует на раздражители, рефлексы отсутствуют, мышцы расслаблены, возможны непроизвольные мочеиспускание и дефекация, отмечается расстройства жизненно важных функций.",
"21.6. Неврологический статус:",
"21.6.1. В пункте «зрачки» пометить нужное знаком ✓;",
"21.6.2. В пункте «речь» пометить знаком ✓ нужное. □ Сохранена □ Отсутствует □ Нарушена При выборе критерия «нарушена» кратко описать нарушения речи (афазия, дизартрия и т.д.)",
"21.6.3. В пункте «походка» пометить знаком ✓ нужное. При выборе критерия «нарушена» кратко описать нарушения походки (паретическая, гемиплегическая, параспастическая, атактическая, «утиная», шаркающая, замедленная и пр.)",
"21.6.4. В пункте «лицо»: □ симметричное □ асимметричное - пометить знаком ✓ нужное",
"21.6.5. В пункте «нистагм»: □ нет, □ горизонтальный, □ вертикальный - пометить знаком ✓ нужное",
"21.6.6. В пункте «тонус мышц» описать тонус мышц (нормальный, гипотония, атония, гипертонус, спастичность, ригидность и др.);",
"21.6.7. В пункте «патологические рефлексы» если патологические рефлексы не выявлены указать «нет», в случае выявления патологических рефлексов их перечислить; К патологическим рефлексам верхних конечностей относятся следующие: Россолимо (проявляется при ударе по концам согнутых 2-4 пальцев на руках). Жуковского (возможно диагностировать при ударе по центру ладони в ответную реакцию на сгибание пальцев руки). Бехтерева (для диагностирования необходимо ударить пациента по наружной стороне тыла кисти руки). Якобсона-Ласка (применяется в момент исследования карпорадиального рефлекса, при этом происходит рефлекторное сгибание всех пальцев кисти руки). Рефлексы данной этиологии могут проявиться в грудном возрасте и продолжать развиваться до 2-3 возраста ребенка. Проявление их в этот возрастной период не считается отклонением от нормы, поэтому н является поводом для беспокойства. В том случае, если данные рефлексы присутствуют у детей 4-6 возраста, то можно предположить о развитии патологических процессов в центральной нервной системе. К патологическим рефлексам нижних конечностей относят следующие: Бабинского (возможно выявить при наличии раздражителя по подошве ноги. Для этого потребуется провести молотком или зубочисткой от низа пятки до самих пальцев). Оппенгейма (для диагностирования потребуется провести рукой по передней части голени). Гордона (может проявиться в момент сжимания мышцы икры на ноге). Шеффера (диагностируется при нажатии на ахиллово сухожилие). Россолимо (для установления потребуется совершить удар молотком по кончикам 2-3 пальцев. О патологии будет свидетельствовать сгибание первого большого пальца на ноге. Оральные рефлексы: назо-лабиальный рефлекс – легкий удар молоточком по спинке носа; сосательный – штриховое раздражение или прикосновение к губам молоточком; хоботковый – легкий удар молоточком по верхней или нижней губе; дистанс-оральный – поднесение молоточка к губам с имитацией удара; ладонно-подбородочный (Маринеску-Радовичи) – штриховое раздражение кожи в области тенара, вызывающее ответное сокращение подбородочной мышцы на стороне раздражения со смещением кожи подбородка кверху.",
"21.6.8. В пункте «менингеальные знаки» если менингеальные знаки не выявлены указать «нет», в случае выявления менингеальных знаков их перечислить; менингеальные симптомы: ригидность мышц затылка (легко обнаруживается при пассивном наклоне головы вперед до соприкосновения подбородка к груди. При ригидности мышц затылка подбородок не касается груди даже в случаях умеренной выраженности этого симптома, не говоря уже о тех случаях, когда интенсивность его достигает сильной степени), симптом Кернига(производится так: нога сгибается под прямым углом в тазобедренном, а также в коленном суставах, после чего исследующий пытается полностью разогнуть ее в коленном суставе. При этом наступает рефлекторное сокращение сгибателей и боль, препятствующие разгибанию.), различные варианты симптома Брудзинского (выявляется при исследовании ригидности мышц затылка, а именно при пассивном наклоне головы вперед. В это время происходит автоматическое сгибание нижних конечностей в тазобедренных и коленных суставах и подтягивание их к животу), симптом Гиллена (вызывается сжатием рукой исследующего четырехглавой мышцы, занимающей, как известно, всю переднюю и отчасти боковую поверхность бедра. В ответ на сжатие упомянутой мышцы возникает сокращение одноименной мышцы на другой ноге.",
"21.6.9. В пункте «плегии, парезы» если плегий, парезов не выявлено указать «нет», при наличии плегий, парезов их описать, указать, локализация справа или слева",
"21.7. В графе «кожа» □ нормальная, □ гиперемия, □ бледная, □ цианоз, □ холодная, □ теплая, □ сухая, □ влажная, □ желтушная, □ гипостатические пятна - пометить нужное знаком ✓.",
"При заполнении графы Т°С записываются цифрой данные измерения температуры тела. При выборе критерия «высыпания» дать краткое описание сыпи (локализация, количество, цвет, размер, форма, болезненность при пальпации, уртикарная, везикулезная, папулезная, геморрагическая и пр.).",
"21.8. В графе «слизистые» описать состояние видимых слизистых полости рта, глаз, век, носа, губ. Цвет – белый, бледно-розовый, цианотичный, желтушный, красный и пр. Высыпание на слизистых (энантема) – локализация, размер; характер, наличие налета, трещин, прикусов, высыпаний и др. Размер, форма, окраска миндалин. Описать состояние языка (форма, величина, наличие налета, трещин, прикусов, язвочек, выраженность сосочков и др.);",
"21.9. В графе «артериальное давление (далее – АД)» внести цифрами значения систолического и диастолического давления, полученные при измерении артериального давления, в графу «адаптированное АД» – значения адаптированного артериального давления со слов пациента или из имеющейся медицинской документации.",
"21.10. В пункте «тоны сердца» пометить нужное знаком ✓, описать шум, при его наличии (шум может быть систолическим и/или диастолическим, выслушиваться над определенной точкой или тотально, а также проводиться на сонные артерии, в подмышечную область и т.п.).",
"21.11. В пункте «пульс» цифрой указать число ударов в минуту, отметить знаком ✓, если пульс отсутствует. В графе «шоковый индекс» при наличии шока, связанного с кровопотерей, рассчитать шоковый индекс (ШИ) Альговера (отношение частоты сердечных сокращений к величине систолического артериального давления). Нормальная величина ШИ =60/120=0,5. Примечание. 60 – ЧСС в 1 мин.,120 – нормальная величина систолического АД в мм рт.ст. При шоке I степени (кровопотеря 15-20 % ОЦК) ШИ=0,8-0,9 (80/110), при шоке II ст. (кровопотеря 20-40 % ОЦК) ШИ=0,9-1,2 (120/90), при шоке III ст. (кровопотеря более 40 % ОЦК) ШИ=1,3 и выше (140/70).",
"21.12. В пункте «асцит» пометить нужное знаком ✓ , в графе периферические отеки отметить нужное;",
"21.13. В пункте «дыхание» указать цифрой частоту дыхания; указать характеристики дыхания: □ свободное, □ затрудненное, □ везикулярное, □ ослабленное, □ жесткое, □ поверхностное, □ пуэрильное, □ хрипы (сухие, влажные, справа, слева,); шум трения плевры, патологическое, отсутствует - пометить нужное знаком ✓.",
"Перкуссия легких (□ ясный лёгочный звук, □ притупление звука (справа, слева), □ запах алкоголя, □ запах ацетона – пометить нужное знаком ✓;",
"21.14. В пункте «живот» пометить нужное знаком ✓; отметить есть ли симптомы раздражения брюшины, при выборе критерия «да» перечислить выявленные симптомы раздражения брюшины по авторам (Щеткина-Блюмберга, Ситковского, Ровзинга, Бартомье-Михельсона, Раздольского, Воскресенского и др.), перистальтика – отметить нужное знаком ✓.",
"21.15. В пункте «печень» нужное отметить знаком ✓: при нормальных размерах печени указать «не увеличена», при увеличении размеров указать находится ли у края реберной дуги или выступает из-под края реберной дуги по среднеключичной линии;",
"21.16. В пункте «мочеиспускание» при нормальном мочеиспускании отметить нужное знаком ✓; указать: □ не нарушено, □ нарушено. Если нарушено, указать как: □ учащено, □ болезненное или □выявлена задержка мочеиспускания. Необходимо описать цвет, прозрачность и объём. В графе «стул» отметить нужное знаком ✓: □ не нарушен, □ нарушен. Если нарушен, указать □ учащен (частоту указать цифрой). □ отсутствует (указать продолжительность отсутствия стула), если нужно описать изменения стула, консистенцию, если есть мелена, обесцвечен, кровь, слизь и др.",
"21.17. В пункте «локальный статус» описываются местные проявления заболевания, при этом указывают их размер, точную локализацию относительно анатомической области тела, опознавательных точек или линий. Например, «кровоточащая линейная рана с ровными краями длиной 5 см, с кровоизлиянием в окружающие мягкие ткани, дном раны является подкожно-жировая клетчатка».",
"21.18. В пункте электрокардиограмма (далее - ЭКГ) вносятся данные проведенных ЭКГ до (1) и после (2) оказания медицинской помощи. При этом указывается:",
"➢ дата и время проведения;",
"➢ является или нет источник ритма синусовым;",
"➢ оценку регулярности ритма;",
"➢ ЧСС;",
"➢ характер положения электрической оси;",
"➢ вывод о наличии либо отсутствии нарушений: проводимости, ритма, работы желудочков и предсердия (гипертрофия, перегрузка), работы миокарда (ишемия, некрозы, дистрофия, рубцы).",
"➢ На ленте ЭКГ указать фамилию пациента, дату и время проведения, ленту подклеть к карте.",
"21.19. В пункте гликемия вносятся данные до оказания помощи (1) и после оказания помощи (2) в ммоль/л.",
"21.20. В пункте сатурация указывается сатурация до ингаляции кислорода (1) и после (2) ингаляции кислорода;"]},
{"n":"22","t":"В пункте «Предварительный диагноз, установленный врачом (фельдшером) допустимо указывать:","subs":[
"основное заболевание – заболевание, которое обусловило вызов СМП. Это заболевание является наиболее серьезным в отношении сохранения жизни и трудоспособности, на лечение которого должны быть направлены мероприятия скорой медицинской помощи;",
"конкурирующее заболевание – заболевание наряду с основным, которым одновременно страдает пациент и которое могло послужить поводом для вызова СМП. Например, трансмуральный инфаркт миокарда и массивная тромбоэмболия легочных артерий, обусловленная флеботромбозом нижних конечностей Конкурирующие заболевания приводят к трудности в диагностике и дифференциальной диагностике;",
"фоновое заболевание – заболевание, которое причинно не связано с основным, но отягощает его течение. Например, острая пневмония на фоне рака гортани;",
"сопутствующее заболевание – патология, которая не связана и не влияет на течение основного заболевания, например, острый бронхит и близорукость."],
"tail":[
"Формулировка диагноза должная быть лаконичной, но в то же время отразить основной патологический процесс. Все фоновые и сопутствующие заболевания, указанные в п.18, отражаются в диагнозе только в том случае, если они имеют значение в диагностике и лечении основной патологии.",
"Таким образом, формируя диагноз, врач СМП (фельдшер, работающий самостоятельно) обязательно указывает основное заболевание, его осложнения, а при необходимости (при наличии) – конкурирующую, фоновую и сопутствующую патологию. При переломах костей сначала следует указать, что сломано, а потом – где сломано. Например, «Закрытый перелом правой плечевой кости в средней трети»."]},
{"n":"23","t":"В пункте отказ от оказания медицинской помощи □, от медицинской транспортировки (эвакуации) в учреждение здравоохранения □ отметить нужное знаком ✓.","tail":[
"В случае отказа заполняется Приложение 1 к карте вызова бригады скорой медицинской помощи согласно постановлению Министерства здравоохранения Республики Беларусь от 04.01.2020 №2. После слова «Я» необходимо чтобы пациент сам записал свои фамилию, имя и отчество(ФИО). Если пациент не может сам писать, то законный представитель пациента, либо супруга (супруг), либо близкий родственник пациента записывают свои (ФИО). Далее заполняющий записывает адрес, по которому зарегистрирован и от чего конкретно дается отказ: от медицинской помощи, транспортировки бригадой СМП в больничную организацию здравоохранения. Если отказ пишет законный представитель, либо супруга (супруг), либо близкий родственник пациента то в этой же строке указывается ФИО пациента. В доступной для пациента форме даются разъяснения о возможных последствиях отказа. Далее записывается число, месяц, год и время заполнения отказа. В конце документа пишется ФИО и ставится подпись пациента либо законного представителя, либо супруга(ги), либо близкого родственника, также ФИО и подпись старшего бригады СМП.",
"В случае отказа пациента либо законного представителя от подписи старший бригады СМП во второй части приложения 1 в строке «Гражданин» самостоятельно записывает ФИО полностью , отмечает знаком ✓ нужное в пунктах от подписи в Отказе от □ оказания медицинской помощи, □ транспортировки бригадой СМП в больничную организацию здравоохранения отказался.",
"Доводится информация о необходимости медицинского вмешательства с указанием возможных последствий отказа. Вносятся ФИО и подписи свидетелей (не менее 2)."]},
{"n":"24","t":"В пункте «медицинская помощь, оказанная на месте вызова и при транспортировке», нужное отметить знаком ✓ и подробно описывается вся оказанная пациенту медицинская помощь и все пособия. Необходимо указать наименование лекарственных средств, процент раствора, дозировку, пути введения. Медицинскую помощь и все пособия необходимо описывать в той последовательности, в которой они проведены. Если лекарственные средства и препараты подлежат предметно-количественному учету, то требуется записать ФИО и подпись старшего бригады, который их назначил, дату и время выполнения назначения."},
{"n":"25","t":"В пункте «Состояние пациента после оказания медицинской помощи» вносятся сведения о состоянии пациента после оказания ему медицинской помощи:","subs":[
"➢ в графу «общее состояние» вписывается один из вариантов из п.п. 21.1.",

  <script>
    (function () {
      "use strict";

      var dataEl = document.getElementById("ccData");
      var listEl = document.getElementById("ccList");
      if (!dataEl || !listEl) return;

      var DATA;
      try { DATA = JSON.parse(dataEl.textContent); }
      catch (e) { console.error("call-card-110: некорректный JSON", e); return; }

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      DATA.forEach(function (item) {
        var el;

        if (item.kind === "doc") {
          el = document.createElement("div");
          el.className = "cc-doc";
          el.textContent = item.t;
          listEl.appendChild(el);
          return;
        }

        if (item.kind === "heading") {
          el = document.createElement("h2");
          el.className = "cc-heading";
          el.textContent = item.t;
          listEl.appendChild(el);
          return;
        }

        if (item.kind === "note") {
          el = document.createElement("div");
          el.className = "cc-note";
          el.textContent = item.t;
          listEl.appendChild(el);
          return;
        }

        if (item.kind === "intro") {
          el = document.createElement("section");
          el.className = "cc-card";
          var html = '';
          item.paras.forEach(function (p) {
            html += '<p class="cc-p">' + esc(p) + '</p>';
          });
          el.innerHTML = html;
          listEl.appendChild(el);
          return;
        }

        // Обычная карточка (с номером или без — для lead)
        el = document.createElement("article");
        el.className = "cc-card";

        var inner = '<div class="cc-head">';
        if (item.n) {
          inner += '<span class="cc-num">' + esc(item.n) + '</span>';
        }
        inner += '<div class="cc-text">' + esc(item.t) + '</div></div>';

        if (item.subs && item.subs.length) {
          inner += '<ul class="cc-subs">';
          item.subs.forEach(function (s) { inner += '<li>' + esc(s) + '</li>'; });
          inner += '</ul>';
        }

        if (item.tail && item.tail.length) {
          inner += '<div class="cc-tail">';
          item.tail.forEach(function (p) { inner += '<p>' + esc(p) + '</p>'; });
          inner += '</div>';
        }

        el.innerHTML = inner;
        listEl.appendChild(el);
      });

      var topBtn = document.getElementById("ccTopBtn");
      if (topBtn) {
        topBtn.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        window.addEventListener("scroll", function () {
          topBtn.classList.toggle("show", window.scrollY > 400);
        }, { passive: true });
      }
    })();
  </script>
