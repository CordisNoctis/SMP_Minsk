<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Клинические калькуляторы и шкалы — СМП Минск</title>
  <meta name="theme-color" content="#7A1F2B">

  <script src="../js/core/theme-init.js"></script>
  <script src="../js/core/version.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/calculators-common.css">
  <link rel="stylesheet" href="../css/calculators-list.css">  
  <link rel="stylesheet" href="../css/result-panel.css">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>

<body>
  <header class="page-header">
    <button type="button" class="back-button" data-back data-back-fallback="../index.html" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="page-title-centered">Калькуляторы и шкалы</h1>
    <span class="header-spacer" aria-hidden="true"></span>
  </header>

  <main class="page">

    <!-- ===== ПАНЕЛЬ ПОИСКА И ФИЛЬТРОВ (1 строка, ширина как у карточки) ===== -->
    <div class="calc-toolbar card">
      <button type="button" class="toolbar-filter-btn" id="openFiltersBtn" aria-label="Фильтры">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
        <span class="toolbar-filter-label">Фильтры</span>
        <span class="toolbar-filter-badge" id="filterBadge" hidden>0</span>
      </button>

      <div class="toolbar-search">
        <svg class="toolbar-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="calcSearchInput" class="toolbar-search-input" placeholder="Поиск калькулятора..." aria-label="Поиск">
        <button type="button" class="toolbar-search-clear" id="searchClearBtn" hidden aria-label="Очистить">✕</button>
      </div>
    </div>

    <!-- ===== Сводка активных фильтров ===== -->
    <div class="calc-filter-summary" id="filterSummary" hidden>
      <span class="filter-summary-text" id="filterSummaryText"></span>
      <button type="button" class="filter-summary-clear" id="clearActiveFiltersBtn">Сбросить</button>
    </div>

    <!-- ===== Список калькуляторов ===== -->
    <div class="calculators-list-compact" id="calculatorsList"></div>

    <!-- ===== Пустое состояние ===== -->
    <div class="calc-empty-state" id="calcEmptyState" hidden>
      <div class="calc-empty-icon">🔍</div>
      <div class="calc-empty-title">Ничего не найдено</div>
      <div class="calc-empty-desc">Попробуйте изменить запрос или сбросить фильтры</div>
      <button type="button" class="btn-secondary" id="emptyResetBtn">Сбросить фильтры</button>
    </div>

  </main>

  <!-- ===== МОДАЛКА ФИЛЬТРОВ ===== -->
  <div class="modal" id="filters-modal" hidden aria-hidden="true">
    <div class="modal-backdrop" id="filtersBackdrop"></div>
    <section class="modal-panel filters-modal-panel" role="dialog" aria-modal="true">
      <header class="modal-header">
        <h2>🔍 Фильтры</h2>
        <button type="button" class="modal-close" id="filtersCloseBtn" aria-label="Закрыть без применения">✕</button>
      </header>

      <div class="modal-body">
        <!-- Специальности -->
        <div class="filters-section">
          <h3 class="filters-section-title">
            <span>🏥</span> Специальности
          </h3>
          <div class="filters-chips" id="filterCategories"></div>
        </div>

        <!-- Подсказка -->
        <div class="filters-hint">
          💡 Можно выбрать несколько специальностей. Будут показаны калькуляторы, которые относятся ко <strong>всем</strong> выбранным категориям одновременно.
        </div>

      <footer class="modal-footer filters-modal-footer">
        <button type="button" class="btn-secondary" id="filtersResetBtn">Сбросить</button>
        <button type="button" class="btn-primary" id="filtersApplyBtn">Применить</button>
      </footer>
    </section>
  </div>

  <script src="../js/core/theme.js"></script>
  <script src="../js/core/back.js"></script>
  <script src="../js/calculators/calculators-list.js"></script>
  <script src="../js/pages/calculators.js"></script>
  <script src="../js/core/sw-register.js"></script>
</body>
</html>
