  <style>
    /* Длинный заголовок в шапке: переносим на несколько строк */
    .ig-header-title {
      white-space: normal;
      line-height: 1.25;
      font-size: 0.95rem;
    }
    @media (max-width: 480px) {
      .ig-header-title { font-size: 0.85rem; }
    }
    .ig-list { display: grid; gap: 10px; margin-bottom: 12px; }

    .ig-card {
      position: relative;
      padding: 12px 14px 12px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .ig-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--border);
    }
    .ig-card.ig-urgent::before { background: #c62828; }
    [data-theme="dark"] .ig-card.ig-urgent::before { background: #ef9a9a; }

    .ig-card-head { display: flex; gap: 10px; align-items: flex-start; }
    .ig-num {
      flex: 0 0 auto;
      min-width: 34px; height: 34px; padding: 0 6px;
      display: grid; place-items: center;
      background: var(--menu-icon-bg);
      color: var(--accent);
      border-radius: 10px;
      font-weight: 800; font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
    }
    .ig-urgent .ig-num { background: rgba(198, 40, 40, 0.12); color: #c62828; }
    [data-theme="dark"] .ig-urgent .ig-num { background: rgba(239, 154, 154, 0.15); color: #ef9a9a; }

    /* Выравнивание по ширине */
    .ig-text {
      min-width: 0;
      font-size: 0.95rem;
      line-height: 1.45;
      text-align: justify;
      hyphens: auto;
    }
    .ig-subs { margin: 8px 0 0; padding-left: 44px; display: grid; gap: 4px; }
    .ig-subs li {
      font-size: 0.9rem;
      line-height: 1.4;
      text-align: justify;
      hyphens: auto;
    }

    .ig-urgent-word { color: #c62828; font-weight: 800; }
    [data-theme="dark"] .ig-urgent-word { color: #ef9a9a; }

    .ig-top-btn {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: 48px; height: 48px;
      border: 0; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: 1.3rem; font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow-hover);
      opacity: 0; pointer-events: none; transform: translateY(10px);
      transition: opacity .2s ease, transform .2s ease;
      z-index: 60;
    }
    .ig-top-btn.show { opacity: 1; pointer-events: auto; transform: none; }
  </style>

  <script>
    (function () {
      "use strict";

      var dataEl = document.getElementById("igData");
      var listEl = document.getElementById("igList");
      if (!dataEl || !listEl) return;

      var DATA;
      try { DATA = JSON.parse(dataEl.textContent); }
      catch (e) { console.error("inform-grounds: некорректный JSON", e); return; }

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function isUrgent(item) {
        if (/немедленно/i.test(item.t)) return true;
        return (item.s || []).some(function (x) { return /немедленно/i.test(x); });
      }

      // Подсветка слова «немедленно» в текстовых узлах (текст не меняется)
      function markWord(root, word, cls) {
        var q = word.toLowerCase();
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        var nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(function (node) {
          var text = node.nodeValue;
          var lower = text.toLowerCase();
          var i = lower.indexOf(q);
          if (i === -1) return;
          var frag = document.createDocumentFragment();
          var pos = 0;
          while (i !== -1) {
            frag.appendChild(document.createTextNode(text.slice(pos, i)));
            var mk = document.createElement("span");
            mk.className = cls;
            mk.textContent = text.substr(i, q.length);
            frag.appendChild(mk);
            pos = i + q.length;
            i = lower.indexOf(q, pos);
          }
          frag.appendChild(document.createTextNode(text.slice(pos)));
          node.parentNode.replaceChild(frag, node);
        });
      }

      DATA.forEach(function (item) {
        var urgent = isUrgent(item);
        var card = document.createElement("article");
        card.className = "ig-card" + (urgent ? " ig-urgent" : "");

        var html = '<div class="ig-card-head"><span class="ig-num">' + esc(item.n) + '</span><div class="ig-text">' + esc(item.t) + '</div></div>';
        if (item.s && item.s.length) {
          html += '<ul class="ig-subs">';
          item.s.forEach(function (sub) { html += '<li>' + esc(sub) + '</li>'; });
          html += '</ul>';
        }
        card.innerHTML = html;

        listEl.appendChild(card);
        markWord(card, "немедленно", "ig-urgent-word");
      });

      var topBtn = document.getElementById("igTopBtn");
      if (topBtn) {
        topBtn.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        window.addEventListener("scroll", function () {
          topBtn.classList.toggle("show", window.scrollY > 400);
        }, { passive: true });
      }
    })();
  </script>
