<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QTc по Bazett — СМП Минск</title>
  <meta name="theme-color" content="#7A1F2B">
  <script src="../js/core/theme-init.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/calculators.css">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
</head>
<body>
  <header class="page-header">
    <button type="button" class="back-button" data-back data-back-fallback="calculators.html" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="page-title-centered">QTc по Bazett</h1>
    <button type="button" class="header-alert-btn" id="calcInfoBtn" aria-label="О формуле">i</button>
  </header>
  <main class="page">
    <section class="card calc-description">
      <p style="margin:0;">Коррекция интервала QT по ЧСС. Оценка риска жизнеопасных аритмий при удлинённом QT.</p>
    </section>
    <div class="card qtc-inputs">
      <div class="qtc-input-group">
        <label class="qtc-input-label">⏱️ Интервал QT</label>
        <div class="qtc-input-row">
          <input type="text" id="qtInput" class="qtc-field" inputmode="numeric" maxlength="3" placeholder="—">
          <span class="qtc-unit">мс</span>
        </div>
      </div>
      <div class="qtc-input-group">
        <label class="qtc-input-label">❤️ Частота сердечных сокращений</label>
        <div class="qtc-input-row">
          <input type="text" id="hrInput" class="qtc-field" inputmode="numeric" maxlength="3" placeholder="—">
          <span class="qtc-unit">уд/мин</span>
        </div>
      </div>
      <div class="qtc-formula-hint">QTc = QT / √(RR), где RR = 60 / ЧСС</div>
    </div>
    <div id="resultPanel" class="result-panel"></div>
  </main>
  <script src="../js/core/theme.js"></script>
  <script src="../js/core/back.js"></script>
  <script src="../js/calculators/calculator-utils.js"></script>
  <script src="../js/calculators/calc-qtc.js"></script>
  <script src="../js/core/sw-register.js"></script>
</body>
</html>
